<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./irlStyle.css">
        <style id="dynamyicStyleSheet"></style>
    </head>
    <body>
        <video id="webcam" autoplay playsinline></video>
        <div id="relativeContainer">
            <canvas id="outputCanvas"></canvas>
            <div id="playerHandsOverlay" class="handOverlay overlay">
                <h1 id="left" class="fingerCount"></h1>
                <h1 id="right" class="fingerCount"></h1>
            </div>
            <div id="computerOverlay" class="handOverlay overlay">
                <h1 id="compLeft" class="fingerCount"></h1>
                <h1 id="compRight" class="fingerCount"></h1>
            </div>
        </div>
        <div id="textOverlay" class="overlay">
            <h1 id="announcementBanner"></h1>
        </div>
        <div id="loseScreen">
            <p id="loseText">Sorry, you lost. Would you like to play again?</p>
            <button id="playAgain" onclick="window.location.reload()">Play Again?</button>
        </div>
        <script src="./irlScript.js" type="module"></script>
    </body>
</html>
